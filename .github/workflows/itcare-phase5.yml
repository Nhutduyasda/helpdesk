name: ITCare Phase 5 verification
on:
  push:
    branches: [codex/phase-5-passwordless-reporting]
  pull_request:
    branches: [phase-4-staging-pilot-readiness]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint:itcare
      - run: npx eslint supabase/functions/public-intake --max-warnings 0
      - run: npm audit --audit-level=high
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/public-intake/index.ts
      - run: npm run build
      - run: node scripts/scan-build.mjs
        env:
          BUILD_SCAN_REPORT: docs/phase-5/build-scan.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-review-build
          path: dist/
          retention-days: 7
# Deliberately no deployment job. Existing staging must be approved separately.
